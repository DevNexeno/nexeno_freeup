version = 1
SPDX-PackageName = "nexeno_freeup"

[[annotations]]
path = ["l10n/**.js", "l10n/**.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nexeno contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["README.md", "CHANGELOG.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nexeno contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "img/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nexeno contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "COPYING"
precedence = "aggregate"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["package.json", "package-lock.json", "composer.json", "composer.lock", "vendor-bin/**/composer.json", "vendor-bin/**/composer.lock", "tests/psalm-baseline.xml", ".gitignore", ".nextcloudignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "none"
SPDX-License-Identifier = "CC0-1.0"
